name: ponte
on:
  push:
    paths: ["ponte/**", ".github/workflows/ponte.yml"]
  pull_request:
    paths: ["ponte/**", ".github/workflows/ponte.yml"]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ponte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ponte/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes ponte tests
      - run: python -m pytest -q
